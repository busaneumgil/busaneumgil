spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/e102}
    username: ${DB_USERNAME:e102}
    password: ${DB_PASSWORD:e102}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
