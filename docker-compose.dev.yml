name: s14p31e102-dev

services:
  postgres:
    extends:
      file: docker-compose.shared.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.shared.yml
      service: redis

  minio:
    extends:
      file: docker-compose.shared.yml
      service: minio

  minio-init:
    extends:
      file: docker-compose.shared.yml
      service: minio-init

  graphhopper:
    build:
      context: .
      dockerfile: INF/graphhopper/Dockerfile
    restart: unless-stopped
    environment:
      GRAPHHOPPER_DATA_FILE: ${GRAPHHOPPER_DATA_FILE:-/data/raw/busan.osm.pbf}
      GRAPHHOPPER_GRAPH_LOCATION: ${GRAPHHOPPER_GRAPH_LOCATION:-/graphhopper/data}
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"
      - "${GRAPHHOPPER_ADMIN_PORT:-8990}:8990"
    volumes:
      - ${GRAPHHOPPER_DATA_DIR:-/opt/e102/graphhopper/raw}:/data/raw:ro
      - graphhopper-dev-data:/graphhopper/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8990/healthcheck >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 3m

  ai:
    build:
      context: ./AI
    restart: unless-stopped
    environment:
      AI_PORT: ${AI_PORT:-5000}
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./BE
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      graphhopper:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/e102}
      DB_USERNAME: ${DB_USERNAME:-e102}
      DB_PASSWORD: ${DB_PASSWORD:-e102}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      S3_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${MINIO_BUCKET:-e102-dev}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-e102}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-e102-e102}
      S3_REGION: ${MINIO_REGION:-ap-northeast-2}
      GRAPHHOPPER_BASE_URL: ${GRAPHHOPPER_BASE_URL:-http://graphhopper:8989}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:5000}
      AUTH_TEST_ENABLED: ${AUTH_TEST_ENABLED:-true}
      AUTH_TEST_KAKAO_JAVASCRIPT_KEY: ${AUTH_TEST_KAKAO_JAVASCRIPT_KEY:-}
      AUTH_TEST_NAVER_CLIENT_ID: ${AUTH_TEST_NAVER_CLIENT_ID:-}
      AUTH_TEST_GOOGLE_CLIENT_ID: ${AUTH_TEST_GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-e102-dev}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-14d}
      JWT_SIGNUP_TOKEN_TTL: ${JWT_SIGNUP_TOKEN_TTL:-10m}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-shared-data:
  redis-shared-data:
  minio-shared-data:
  graphhopper-dev-data:
