global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          environment: dev
          runtime_stack: s1-dev
          service: redis

  - job_name: s1-dev-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels:
          environment: dev
          runtime_stack: s1-dev
          service: backend
