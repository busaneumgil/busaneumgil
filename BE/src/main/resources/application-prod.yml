spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    hibernate:
      # Bootstrap 단계에서는 누락 테이블을 자동 생성하기 위해 update를 기본값으로 둔다.
      # 운영 전환 후에는 .env.prod 또는 compose 값으로 validate로 되돌린다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

auth:
  test:
    enabled: ${AUTH_TEST_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:e102}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  signup-token-ttl: ${JWT_SIGNUP_TOKEN_TTL:10m}
