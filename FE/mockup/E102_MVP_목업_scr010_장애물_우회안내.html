<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E102 MVP 목업 - SCR-010 장애물 우회 안내</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --success: #34a853;
    --danger: #ea4335;
    --warning: #f29900;
    --warning-soft: rgba(242, 153, 0, 0.18);
    --gray-50: #f8f9fa;
    --gray-100: #f1f3f4;
    --gray-200: #e8eaed;
    --gray-400: #bdc1c6;
    --gray-500: #9aa0a6;
    --gray-700: #5f6368;
    --gray-900: #202124;
    --white: #ffffff;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --radius-xl: 28px;
    --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.12);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.22);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background:
      radial-gradient(circle at top, rgba(51, 84, 172, 0.35), transparent 32%),
      linear-gradient(180deg, #17182a 0%, #0f1220 100%);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  .phone-frame {
    width: min(399px, calc(100vw - 32px));
    aspect-ratio: 399 / 836;
    padding: 12px;
    border-radius: 50px;
    background: #111;
    box-shadow:
      0 0 0 2px #2a2a2a,
      0 0 0 6px #1a1a1a,
      0 40px 80px rgba(0, 0, 0, 0.55);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 40px;
    background: var(--white);
    position: relative;
  }

  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px 0;
    color: var(--white);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 17px;
    height: 10px;
    border: 1.8px solid currentColor;
    border-radius: 3px;
    position: relative;
  }

  .status-dot::after {
    content: "";
    position: absolute;
    right: -4px;
    top: 2px;
    width: 2px;
    height: 4px;
    background: currentColor;
    border-radius: 1px;
  }

  .status-bar-signal,
  .status-bar-wifi {
    width: 14px;
    height: 10px;
    border-bottom: 2px solid currentColor;
    border-radius: 50% 50% 0 0;
    position: relative;
  }

  .status-bar-signal::after,
  .status-bar-wifi::after {
    content: "";
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: -2px;
    border-bottom: 2px solid currentColor;
    border-radius: 50% 50% 0 0;
  }

  .navi-map {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      linear-gradient(180deg, #d9ead9 0%, #d5e4d3 100%);
  }

  .map-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.22) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.8;
  }

  .map-road-h,
  .map-road-v {
    position: absolute;
    background: rgba(255, 255, 255, 0.62);
  }

  .map-road-h.main {
    left: 0;
    right: 0;
    top: 45.5%;
    height: 22px;
  }

  .map-road-v.center {
    top: 0;
    bottom: 0;
    left: 54.5%;
    width: 22px;
  }

  .map-road-v.side {
    top: 9%;
    bottom: 24%;
    left: 18%;
    width: 18px;
  }

  .map-road-h.top {
    top: 17%;
    left: 18%;
    width: 52%;
    height: 18px;
  }

  .map-road-h.lower {
    top: 71%;
    left: 18%;
    width: 40%;
    height: 18px;
  }

  .navi-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .route-ghost {
    fill: none;
    stroke: rgba(32, 33, 36, 0.18);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 8 10;
  }

  .navi-route-line {
    fill: none;
    stroke: var(--primary);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 620;
    stroke-dashoffset: 620;
    animation: draw-route 2.2s ease forwards;
  }

  .navi-route-progress {
    fill: none;
    stroke: var(--primary-dark);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .reroute-hint {
    fill: none;
    stroke: rgba(26, 115, 232, 0.3);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 2 16;
    animation: hint-flow 1.7s linear infinite;
  }

  .map-dot {
    stroke: var(--white);
    stroke-width: 3;
  }

  .map-dot.start {
    fill: var(--success);
  }

  .map-dot.end {
    fill: var(--danger);
  }

  .map-dot.user {
    fill: var(--primary);
  }

  .user-pulse {
    animation: pulse 1.8s ease-out infinite;
    transform-origin: center;
  }

  .obstacle-group {
    transform-origin: center;
    animation: float-alert 1.8s ease-in-out infinite;
  }

  .obstacle-shadow {
    fill: rgba(242, 153, 0, 0.22);
  }

  .obstacle-body {
    fill: #f29900;
    stroke: #d97f00;
    stroke-width: 2;
  }

  .obstacle-stripe {
    stroke: #fff6dc;
    stroke-width: 4;
    stroke-linecap: round;
  }

  .alert-pin {
    fill: var(--danger);
    stroke: var(--white);
    stroke-width: 3;
  }

  .alert-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.9);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .alert-pill::before {
    content: "!";
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    font-size: 11px;
  }

  .navi-top-card {
    position: absolute;
    top: 58px;
    left: 16px;
    right: 16px;
    z-index: 20;
    padding: 18px 20px 20px;
    color: var(--white);
    border-radius: 22px;
    background:
      linear-gradient(135deg, #256fd5 0%, #1a73e8 65%, #1968d5 100%);
    box-shadow: var(--shadow-lg);
  }

  .navi-direction {
    font-size: 15px;
    opacity: 0.85;
    margin-bottom: 6px;
  }

  .navi-instruction {
    font-size: 31px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.05em;
  }

  .navi-dist-next {
    margin-top: 8px;
    font-size: 16px;
    opacity: 0.88;
  }

  .reroute-chip {
    position: absolute;
    top: 202px;
    left: 20px;
    z-index: 20;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(32, 33, 36, 0.76);
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(10px);
  }

  .hazard-note {
    position: absolute;
    right: 18px;
    top: 276px;
    z-index: 20;
    width: 152px;
    padding: 14px 14px 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: var(--shadow-sm);
  }

  .hazard-note-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--warning-soft);
    color: #a85d00;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .hazard-note-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--gray-900);
    line-height: 1.3;
    margin-bottom: 6px;
    letter-spacing: -0.03em;
  }

  .hazard-note-copy {
    font-size: 12px;
    line-height: 1.45;
    color: var(--gray-700);
  }

  .navi-bottom-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    padding: 20px 20px 26px;
    background: rgba(255, 255, 255, 0.98);
    border-radius: 30px 30px 0 0;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12);
  }

  .navi-eta-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .navi-eta-label {
    font-size: 12px;
    color: var(--gray-500);
    margin-bottom: 4px;
  }

  .navi-eta-value {
    font-size: 30px;
    font-weight: 800;
    color: var(--gray-900);
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .navi-eta-distance {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-700);
    line-height: 1.2;
  }

  .navi-eta-extra {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    padding: 6px 10px;
    border-radius: 999px;
    background: #eef5ff;
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 700;
  }

  .navi-controls {
    display: flex;
    gap: 10px;
  }

  .navi-ctrl-btn {
    flex: 1;
    height: 52px;
    border: 1.5px solid var(--gray-200);
    border-radius: 16px;
    background: var(--white);
    color: var(--gray-700);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .navi-ctrl-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
  }

  .navi-ctrl-btn.voice-on {
    background: #eef5ff;
    border-color: rgba(26, 115, 232, 0.24);
    color: var(--primary-dark);
  }

  .navi-ctrl-btn.danger {
    border-color: rgba(234, 67, 53, 0.75);
    color: var(--danger);
  }

  @keyframes draw-route {
    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes pulse {
    0% {
      transform: scale(0.92);
      opacity: 0.55;
    }
    70% {
      transform: scale(1.18);
      opacity: 0;
    }
    100% {
      transform: scale(1.18);
      opacity: 0;
    }
  }

  @keyframes hint-flow {
    to {
      stroke-dashoffset: -36;
    }
  }

  @keyframes float-alert {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-4px);
    }
  }

  @media (max-width: 430px) {
    body {
      padding: 16px 10px;
    }

    .phone-frame {
      width: calc(100vw - 20px);
    }
  }
</style>
</head>
<body>
  <main class="phone-frame" aria-label="SCR-010 장애물 우회 안내 목업">
    <section class="phone-screen">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <div class="status-icons">
          <span class="status-bar-signal"></span>
          <span class="status-bar-wifi"></span>
          <span class="status-dot"></span>
        </div>
      </div>

      <section class="navi-map">
        <div class="map-grid"></div>
        <div class="map-road-h main"></div>
        <div class="map-road-v center"></div>
        <div class="map-road-v side"></div>
        <div class="map-road-h top"></div>
        <div class="map-road-h lower"></div>

        <div class="navi-top-card">
          <div class="alert-pill">장애물 감지</div>
          <div class="navi-direction">15m 앞</div>
          <div class="navi-instruction">← 좌측 보도로 우회</div>
          <div class="navi-dist-next">공사 적치물을 피해 안전 경로로 다시 안내 중</div>
        </div>

        <div class="reroute-chip">재탐색 완료 · 기존 경로 대비 +40m</div>

        <div class="hazard-note">
          <div class="hazard-note-label">🚧 통행 주의</div>
          <div class="hazard-note-title">공사 자재 적치물</div>
          <div class="hazard-note-copy">보도 폭이 70cm로 좁아져 직진 통과가 어려워요.</div>
        </div>

        <svg class="navi-svg" viewBox="0 0 375 812" role="img" aria-label="사용자 위치, 장애물 위치, 우회 경로가 표시된 지도">
          <polyline
            class="route-ghost"
            points="96,588 96,430 96,300 202,300 202,214 314,214"
          />

          <polyline
            class="reroute-hint"
            points="96,588 96,444 62,444 62,272 226,272 226,214 314,214"
          />

          <polyline
            class="navi-route-line"
            points="96,588 96,444 62,444 62,272 226,272 226,214 314,214"
          />

          <polyline
            class="navi-route-progress"
            points="96,588 96,514"
          />

          <circle class="map-dot start" cx="96" cy="588" r="13" />
          <circle class="map-dot end" cx="314" cy="214" r="13" />

          <circle class="user-pulse" cx="96" cy="514" r="30" fill="rgba(26, 115, 232, 0.22)" />
          <circle class="map-dot user" cx="96" cy="514" r="14" />

          <g class="obstacle-group" transform="translate(96 370)">
            <ellipse class="obstacle-shadow" cx="0" cy="20" rx="34" ry="16"></ellipse>
            <rect class="obstacle-body" x="-28" y="-6" rx="10" ry="10" width="56" height="22"></rect>
            <line class="obstacle-stripe" x1="-18" y1="-2" x2="-8" y2="10"></line>
            <line class="obstacle-stripe" x1="-2" y1="-2" x2="8" y2="10"></line>
            <line class="obstacle-stripe" x1="14" y1="-2" x2="24" y2="10"></line>
            <circle class="alert-pin" cx="0" cy="-26" r="12"></circle>
            <path d="M0 -32 L0 -24" stroke="white" stroke-width="3" stroke-linecap="round"></path>
            <circle cx="0" cy="-20" r="2" fill="white"></circle>
          </g>
        </svg>

        <div class="navi-bottom-panel">
          <div class="navi-eta-row">
            <div>
              <div class="navi-eta-label">남은 시간</div>
              <div class="navi-eta-value">9분</div>
            </div>
            <div style="text-align: right;">
              <div class="navi-eta-label">남은 거리</div>
              <div class="navi-eta-distance">460m</div>
            </div>
          </div>

          <div class="navi-eta-extra">우회 반영됨 · 도착 예상 1분 지연</div>

          <div class="navi-controls">
            <button id="voice-toggle" class="navi-ctrl-btn voice-on" type="button" aria-pressed="true">🔊 음성 ON</button>
            <button class="navi-ctrl-btn" type="button">🗺️ 전체경로</button>
            <button class="navi-ctrl-btn danger" type="button">✕ 종료</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const voiceToggle = document.getElementById("voice-toggle");

    voiceToggle.addEventListener("click", () => {
      const isOn = voiceToggle.classList.toggle("voice-on");
      voiceToggle.setAttribute("aria-pressed", String(isOn));
      voiceToggle.textContent = isOn ? "🔊 음성 ON" : "🔇 음성 OFF";
    });
  </script>
</body>
</html>
